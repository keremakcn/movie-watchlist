<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Search Movies</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>

<body>
    <main class="search-page">
        <a class="back-link" href="/">← Back to Watchlist</a>

        <section class="form-card">
            <h1>Search Movies</h1>

            <form class="catalog-search-form" action="/search" method="get">
                <input
                    type="text"
                    name="q"
                    placeholder="Search for a movie"
                    value="{{ query }}"
                    required
                >
                <button type="submit">Search</button>
            </form>
        </section>

        {% if query %}
            <section class="search-results">
                <h2>Results</h2>

                {% for movie in results %}
                    <article class="catalog-card">
                        <h2>
                            <a href="/catalog_movie/{{ movie.id }}">
                                {{ movie.title }}
                            </a>
                        </h2>
                        <p>{{ movie.year }} · {{ movie.genre }}</p>

                        <form action="/add_from_catalog" method="post">
                            <input type="hidden" name="movie_id" value="{{ movie.id }}">
                            <button type="submit">+ Add to Watchlist</button>
                        </form>
                    </article>
                {% else %}
                    <p>No movies found.</p>
                {% endfor %}
            </section>
        {% endif %}
    </main>
</body>
</html>
