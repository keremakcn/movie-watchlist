<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Edit Movie</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>

<body>
    <main class="form-page">
        <a class="back-link" href="/movie/{{ movie.id }}">← Back to Movie</a>

        <section class="form-card">
            <h1>Edit Movie</h1>
            <h2>{{ movie.title }}</h2>

            <form class="movie-form" action="/edit/{{ movie.id }}" method="post">
                <label for="rating">Rating (1–10)</label>
                <input
                    id="rating"
                    type="number"
                    name="rating"
                    min="1"
                    max="10"
                    value="{{ movie.rating or '' }}"
                >

                <label for="note">Note</label>
                <textarea
                    id="note"
                    name="note"
                    rows="5"
                >{{ movie.note or '' }}</textarea>

                <button type="submit">Save Changes</button>
            </form>
        </section>
    </main>
</body>
</html>
